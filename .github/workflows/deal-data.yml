name: Validate deals

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run verify
      - run: vp run data:check
      - run: vp test run
      - run: vp build
